name: Supabase Keep Alive

on:
  schedule:
    # Corre cada 3 días a las 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Permite correrlo manualmente desde GitHub si se requiere

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Health Endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://uvzntzuhhdaopudmxqme.supabase.co/auth/v1/health
